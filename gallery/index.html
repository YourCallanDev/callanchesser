<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Callan Chesser</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="../index.html"><img src="/assets/logo.png" alt="Callan Chesser Logo" class="logo"></a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../credits/index.html">Credits</a>
            <a href="/gallery/" class="active">Gallery</a>
            <a href="../contact/index.html">Contact</a>
        </nav>
    </header>

    <main class="gallery-page">
        <h1 class="hero-title reveal">Gallery</h1>

        <!-- CATEGORY TOGGLE BUTTONS (Neither highlighted by default) -->
        <div class="category-toggle-container reveal reveal-delay-1">
            <button class="cat-btn" id="showsToggleBtn">SHOWS</button>
            <button class="cat-btn" id="projectsToggleBtn">PROJECTS</button>
        </div>

        <!-- SECONDARY BUTTON ROW (Populated dynamically via JS) -->
        <div class="sub-filter-container reveal reveal-delay-2" id="subFilterRow"></div>

        <!-- SHOWS CONTAINER -->
        <div class="gallery-category-group" id="showsGroup">
            
            <!-- SHOW ITEM 1: Time Machine -->
            <section class="show-wrapper gallery-item-section" id="show-time-machine">
                <a href="../credits/index.html" class="back-btn reveal">← Back to Credits</a>
                <h2 class="gallery-item-title">Time Machine</h2>
                <div class="show-images" id="showGallery">
                    <button class="arrow left" id="prevBtn">❮</button>
                    
                    <img class="slide active" src="/assets/gallery/Time Machine/1.png" alt="Show Image 1">
                    <img class="slide" src="/assets/gallery/Time Machine/2.png" alt="Show Image 2">
                    <img class="slide" src="/assets/gallery/Time Machine/3.png" alt="Show Image 3">
                    <img class="slide" src="/assets/gallery/Time Machine/4.png" alt="Show Image 4">
                    <img class="slide" src="/assets/gallery/Time Machine/5.png" alt="Show Image 5">
                    <img class="slide" src="/assets/gallery/Time Machine/6.png" alt="Show Image 6">
                    <img class="slide" src="/assets/gallery/Time Machine/7.png" alt="Show Image 7">
                    
                    <button class="arrow right" id="nextBtn">❯</button>
                </div>
            </section>

            <!-- SHOW ITEM 2: The Little Mermaid -->
            <section class="show-wrapper gallery-item-section" id="show-little-mermaid">
                <a href="../credits/index.html" class="back-btn reveal">← Back to Credits</a>
                <h2 class="gallery-item-title">The Little Mermaid</h2>
                <div class="show-images">
                    <button class="arrow left">❮</button>
                    
                    <img class="slide active" src="/assets/gallery/Little Mermaid/1.jpeg" alt="Show Image 1">
                    <img class="slide" src="/assets/gallery/Little Mermaid/7.jpg" alt="Show Image 2">
                    <img class="slide" src="/assets/gallery/Little Mermaid/2.jpeg" alt="Show Image 3">
                    <img class="slide" src="/assets/gallery/Little Mermaid/3.jpeg" alt="Show Image 4">
                    <img class="slide" src="/assets/gallery/Little Mermaid/5.jpg" alt="Show Image 5">
                    <img class="slide" src="/assets/gallery/Little Mermaid/5.jpeg" alt="Show Image 6">
                    <img class="slide" src="/assets/gallery/Little Mermaid/6.jpg" alt="Show Image 7">
                    <img class="slide" src="/assets/gallery/Little Mermaid/4.jpeg" alt="Show Image 8">
                    
                    
                    <button class="arrow right">❯</button>
                </div>
            </section>

        </div>

        <!-- PROJECTS CONTAINER -->
        <div class="gallery-category-group" id="projectsGroup">
            
            <!-- PROJECT ITEM 1: TGA Stage Lighting Setup -->
            <section class="show-wrapper gallery-item-section" id="project-tga-lighting">
                <a href="../credits/index.html" class="back-btn reveal">← Back to Credits</a>
                <h2 class="gallery-item-title">TGA Stage Lighting Setup</h2>
                <div class="show-images">
                    <button class="arrow left">❮</button>
                    
                    <img class="slide active" src="/assets/gallery/Projects/TGA/1.png" alt="TGA Project Image 1">
                    <img class="slide" src="/assets/gallery/Projects/TGA/2.png" alt="TGA Project Image 2">
                    
                    <button class="arrow right">❯</button>
                </div>
            </section>

        </div>
    </main>

    <!-- FULLSCREEN LIGHTBOX MODAL -->
    <div class="lightbox-modal" id="lightboxModal">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <div class="lightbox-content" id="lightboxContent"></div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <p class="footer-credit">&copy; Callan Chesser. All rights reserved.</p>
        </div>
    </footer>

    <script src="gallery.js"></script>
</body>
</html>
